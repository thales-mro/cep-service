spring:
  application:
    name: cep-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cep}
    username: ${DB_USER:cep}
    password: ${DB_PASSWORD:cep}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Se o Kafka estiver fora do ar, a requisição espera no máximo 2s em vez dos 60s padrão.
        max.block.ms: 2000
        spring.json.add.type.headers: false
    consumer:
      group-id: cep-lookup-log
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: uma mensagem malformada vai para a DLT em vez de travar o consumidor.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.thalesoliveira.cep.domain.event.CepLookupEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.thalesoliveira.cep.domain.event

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  kafka:
    topic: cep-lookups
  providers:
    viacep:
      base-url: https://viacep.com.br
      connect-timeout: 2s
      read-timeout: 3s
    brasilapi:
      base-url: https://brasilapi.com.br
      connect-timeout: 2s
      read-timeout: 3s
